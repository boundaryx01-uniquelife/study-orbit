<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1026" />
  <title>STUDY ORBIT WebDB</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stars"></div>
  <div id="appShell">
    <header class="hero">
      <div>
        <p class="eyebrow">STUDY ORBIT</p>
        <h1 id="screenTitle">ORBIT 시작</h1>
        <p id="screenSub" class="subtitle">Supabase Web DB 연결 버전</p>
      </div>
      <div class="orbit-logo"><span></span></div>
    </header>

    <main id="screen"></main>

    <nav class="tabbar" aria-label="주 메뉴">
      <button data-screen="today" class="active"><b>✦</b><span>오늘</span></button>
      <button data-screen="study"><b>◷</b><span>학습</span></button>
      <button data-screen="books"><b>▣</b><span>문제집</span></button>
      <button data-screen="report"><b>▥</b><span>리포트</span></button>
      <button data-screen="archive"><b>◎</b><span>기록관</span></button>
    </nav>
  </div>

  <dialog id="modal"></dialog>
  <script type="module" src="app.js?v=0.5.1"></script>
</body>
</html>
