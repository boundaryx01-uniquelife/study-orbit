<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b1026" />
<title>STUDY ORBIT</title>
<style>
:root{--bg:#070b1e;--panel:rgba(255,255,255,.12);--line:rgba(255,255,255,.18);--text:#f8fafc;--muted:#aab4c5;--card:rgba(255,255,255,.95);--ink:#0f172a;--green:#80ed99;--yellow:#ffd166;--cyan:#56ccf2;--violet:#b8a1ff;--radius:26px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{color:var(--text);background:radial-gradient(circle at 18% 0%,rgba(86,204,242,.35),transparent 30%),radial-gradient(circle at 88% 10%,rgba(184,161,255,.32),transparent 34%),linear-gradient(180deg,#070b1e,#111735);overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}.stars{position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#fff 1px,transparent 1px);background-size:72px 72px,119px 119px;background-position:0 0,28px 38px;mask-image:linear-gradient(to bottom,#000,transparent)}#appShell{position:relative;min-height:100vh;max-width:520px;margin:0 auto;padding-bottom:92px}.hero{display:flex;justify-content:space-between;gap:18px;padding:28px 20px 16px}.eyebrow{margin:0 0 8px;color:#c7d2fe;letter-spacing:.16em;font-size:12px;font-weight:950}h1{margin:0;font-size:32px;line-height:1.08;letter-spacing:-.04em}.subtitle{margin:8px 0 0;color:#cbd5e1;font-size:14px}.orbit-logo{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid var(--line)}.orbit-logo span{width:24px;height:24px;border-radius:50%;background:#fff;position:relative}.orbit-logo span:after{content:"";position:absolute;inset:-15px -23px;border:3px solid rgba(255,255,255,.75);border-radius:50%;transform:rotate(-18deg)}main{padding:0 16px 24px;min-width:0}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;backdrop-filter:blur(18px);box-shadow:0 20px 70px rgba(0,0,0,.16)}.light{background:var(--card);color:var(--ink)}.muted{color:var(--muted)}.light .muted{color:#64748b}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.primary,.secondary,.danger{border:0;border-radius:18px;padding:15px 16px;font-weight:950;width:100%}.primary{color:#111827;background:linear-gradient(135deg,var(--yellow),var(--green));box-shadow:0 18px 36px rgba(255,209,102,.22)}.secondary{color:#fff;background:rgba(255,255,255,.12);border:1px solid var(--line)}.light .secondary,.modal-body .secondary{color:#111827;background:#fff;border:1px solid #e2e8f0}.danger{background:#fee2e2;color:#991b1b}.big{font-size:18px;padding:19px}.field{margin-bottom:13px}.label{display:block;font-size:13px;font-weight:950;color:#dbeafe;margin-bottom:7px}.modal-body .label{color:#475569}input,select{width:100%;border:0;border-radius:16px;padding:14px;background:#f8fafc;color:#111827;outline:2px solid transparent}input:focus,select:focus{outline-color:#93c5fd}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill{display:inline-flex;border-radius:999px;padding:6px 10px;background:rgba(255,255,255,.14);font-size:12px;font-weight:950}.light .pill{background:#eef2ff;color:#3730a3}.orbit-card,.book-card,.search-result{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);min-width:0}.light-card{background:#f8fafc;color:#111827;border:1px solid #e2e8f0}.planet{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--violet))}.check{width:26px;height:26px;border:1px solid rgba(255,255,255,.42);border-radius:50%;display:grid;place-items:center}.done .check{background:var(--green);color:#052e16;border:0}.cover{width:58px;height:82px;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,#1d4ed8,#7c3aed);color:#fff;display:grid;place-items:end start;padding:8px;font-size:11px;font-weight:900}.cover img{width:100%;height:100%;object-fit:cover}.progress{height:10px;border-radius:999px;overflow:hidden;background:#e2e8f0;margin:10px 0 8px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#56ccf2,#80ed99,#ffd166)}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:20px;background:#f8fafc;border:1px solid #e2e8f0}.stat b{display:block;font-size:24px}.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:78px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(7,11,30,.84);border-top:1px solid var(--line);backdrop-filter:blur(18px);z-index:10}.tabbar button{border:0;background:transparent;color:#94a3b8;display:grid;place-items:center;gap:2px;padding:7px 2px;min-width:0}.tabbar b{font-size:21px}.tabbar span{font-size:11px;font-weight:950}.tabbar .active{color:#fff}dialog{border:0;border-radius:28px;padding:0;width:min(480px,calc(100% - 28px));max-height:88vh;overflow:auto;background:#fff;color:#111827}.modal-body{padding:20px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(min-width:900px){body{padding:24px}#appShell{width:min(1180px,calc(100vw - 48px));max-width:none;min-height:calc(100vh - 48px);display:grid;grid-template-columns:112px minmax(0,1fr);grid-template-rows:132px minmax(0,1fr);padding:0;border:1px solid var(--line);border-radius:34px;overflow:hidden;background:rgba(7,11,30,.28)}.hero{grid-column:1/-1;grid-row:1;padding:30px 36px;border-bottom:1px solid var(--line)}h1{font-size:44px}main{grid-column:2;grid-row:2;width:100%;max-width:840px;min-width:0;margin:0 auto;padding:24px 36px 44px;overflow-x:hidden}.tabbar{position:relative!important;left:auto!important;bottom:auto!important;transform:none!important;grid-column:1!important;grid-row:2!important;width:112px!important;height:100%!important;display:flex!important;flex-direction:column!important;gap:8px!important;padding:20px 10px!important;border-top:0!important;border-right:1px solid var(--line)!important;background:rgba(7,11,30,.72)!important}.tabbar button{width:90px!important;height:64px!important;min-height:64px!important;margin:0 auto!important;border-radius:18px!important;display:grid!important;grid-template-columns:1fr!important;grid-template-rows:28px 18px!important;place-items:center!important;white-space:nowrap!important}.tabbar .active{background:rgba(255,255,255,.14)!important}.book-card{grid-template-columns:64px minmax(0,1fr)!important}.book-card>div{min-width:0}.book-card strong,.book-card small{overflow-wrap:anywhere}.panel{max-width:100%;overflow:hidden}}
@media(max-width:420px){.grid2,.modal-actions{grid-template-columns:1fr}.hero{padding:22px 16px 12px}h1{font-size:28px}main{padding:0 14px 24px}}
</style>
</head>
<body>
<div class="stars"></div>
<div id="appShell">
<header class="hero"><div><p class="eyebrow">STUDY ORBIT</p><h1 id="screenTitle">ORBIT 시작</h1><p id="screenSub" class="subtitle">배포 안정화 버전</p></div><div class="orbit-logo"><span></span></div></header>
<main id="screen"></main>
<nav class="tabbar"><button data-screen="today" class="active"><b>✦</b><span>오늘</span></button><button data-screen="study"><b>◷</b><span>학습</span></button><button data-screen="books"><b>▣</b><span>문제집</span></button><button data-screen="report"><b>▥</b><span>리포트</span></button><button data-screen="archive"><b>◎</b><span>기록관</span></button></nav>
</div><dialog id="modal"></dialog>
<script>
const $=s=>document.querySelector(s);const KEY='study-orbit-session-v068';let cfg=null,session=readSession(),profile=null,screen='today',timer=null,data={goals:[],books:[],sessions:[],mistakes:[]};const today=()=>new Date().toISOString().slice(0,10);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const fmt=m=>`${Math.floor(Number(m||0)/60)}시간 ${Number(m||0)%60}분`;
main();
async function main(){bindTabs();tabs(false);setHead('ORBIT 로딩','환경설정을 확인합니다.');html('<section class="panel light"><h2>잠시만요</h2><p class="muted">앱을 준비하고 있습니다.</p></section>');try{cfg=await localJson('/api/config');if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)return setup('Supabase 환경변수가 비어 있습니다.');if(!session?.access_token)return auth('signup');if(!await loadUser()){clearSession();return auth('signin')}await ensureProfile();await loadData();render()}catch(e){setup(e.message)}}
function setHead(t,s){$('#screenTitle').textContent=t;$('#screenSub').textContent=s||'기록은 짧게, 학습은 깊게.'}function html(v){$('#screen').innerHTML=v}function tabs(v){const el=$('.tabbar');if(!el)return;if(v){el.style.removeProperty('display')}else{el.style.display='none'}}function setup(m){tabs(false);setHead('설정 필요','환경변수를 확인하세요.');html(`<section class="panel light"><h2>설정 오류</h2><p class="muted">${esc(m)}</p></section>`)}
function readSession(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}function saveSession(s){session=s;localStorage.setItem(KEY,JSON.stringify(s))}function clearSession(){session=null;localStorage.removeItem(KEY)}
async function localJson(url){const r=await fetch(url);const t=await r.text();if(!r.ok)throw Error(t||`HTTP ${r.status}`);return t?JSON.parse(t):null}function hdr(auth=true){const h={apikey:cfg.supabaseAnonKey,'Content-Type':'application/json'};if(auth&&session?.access_token)h.Authorization=`Bearer ${session.access_token}`;return h}async function sb(path,opt={}){const r=await fetch(cfg.supabaseUrl+path,{method:opt.method||'GET',headers:{...hdr(opt.auth!==false),...(opt.headers||{})},body:opt.body});const t=await r.text();if(!r.ok){let msg=t;try{const j=JSON.parse(t);msg=j.message||j.error_description||j.error||t}catch{}throw Error(msg||`HTTP ${r.status}`)}return t?JSON.parse(t):null}
async function loadUser(){try{const u=await sb('/auth/v1/user');if(!u?.id)return false;session.user=u;localStorage.setItem(KEY,JSON.stringify(session));return true}catch{return false}}async function ensureProfile(meta={}){if(!session?.user?.id&&!(await loadUser()))throw Error('로그인 사용자 정보를 확인할 수 없습니다.');const uid=encodeURIComponent(session.user.id);const rows=await sb(`/rest/v1/profiles?select=*&id=eq.${uid}`);if(rows?.length){profile=rows[0];return}const body={id:session.user.id,display_name:meta.display_name||session.user.user_metadata?.display_name||session.user.email||'ORBIT 사용자',grade:meta.grade||session.user.user_metadata?.grade||'미지정',target_school_type:meta.target_school_type||session.user.user_metadata?.target_school_type||'나의 학습 기록'};const ins=await sb('/rest/v1/profiles',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});profile=ins?.[0]||body}
async function loadData(){const [p,b,g,s,m]=await Promise.all([sb(`/rest/v1/profiles?select=*&id=eq.${encodeURIComponent(session.user.id)}`),sb('/rest/v1/books?select=*&order=created_at.desc'),sb(`/rest/v1/daily_goals?select=*&goal_date=eq.${today()}&order=created_at.asc`),sb('/rest/v1/study_sessions?select=*&order=created_at.desc&limit=80'),sb('/rest/v1/memorable_mistakes?select=*&order=created_at.desc&limit=80')]);profile=p?.[0]||profile;data={books:b||[],goals:g||[],sessions:s||[],mistakes:m||[]}}
function bindTabs(){document.querySelectorAll('.tabbar button').forEach(btn=>btn.onclick=async()=>{screen=btn.dataset.screen;await loadData();render()})}function render(){tabs(true);document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));if(screen==='today')renderToday();if(screen==='study')renderStudy();if(screen==='books')renderBooks();if(screen==='report')renderReport();if(screen==='archive')renderArchive()}
function userStrip(){return `<section class="panel"><div class="row"><div><strong>${esc(profile?.display_name||session?.user?.email||'ORBIT')}</strong><div class="muted" style="font-size:12px">${esc(profile?.grade||'')} · ${esc(profile?.target_school_type||'')}</div></div><button id="logoutBtn" class="secondary" style="width:auto">로그아웃</button></div></section>`}function bindLogout(){const b=$('#logoutBtn');if(b)b.onclick=()=>{clearSession();profile=null;data={goals:[],books:[],sessions:[],mistakes:[]};auth('signin')}}
function auth(mode='signup'){tabs(false);setHead('ORBIT 로그인','웹 DB에 나의 학습 기록을 저장합니다.');html(`<section class="panel"><h2>학습 궤도 입장</h2><form id="authForm"><div class="field"><label class="label">이메일</label><input id="email" type="email" required></div><div class="field"><label class="label">비밀번호</label><input id="password" type="password" minlength="6" required></div><div id="signupOnly"><div class="field"><label class="label">이름 또는 별명</label><input id="displayName"></div><div class="grid2"><div class="field"><label class="label">학년</label><select id="grade"><option>초6</option><option>중1</option><option>중2</option><option>중3</option><option>고1</option><option>기타</option></select></div><div class="field"><label class="label">목표</label><select id="target"><option>과학고 준비</option><option>한국과학영재학교 준비</option><option>특목고 준비</option><option>수학·과학 심화</option></select></div></div></div><button class="primary big" id="authSubmit"></button></form><button class="secondary" id="authToggle" style="margin-top:10px"></button></section>`);const apply=()=>{$('#signupOnly').style.display=mode==='signup'?'block':'none';$('#authSubmit').textContent=mode==='signup'?'회원가입':'로그인';$('#authToggle').textContent=mode==='signup'?'이미 계정이 있어요':'새 계정 만들기'};$('#authToggle').onclick=()=>{mode=mode==='signup'?'signin':'signup';apply()};$('#authForm').onsubmit=async e=>{e.preventDefault();try{if(mode==='signup'){const meta={display_name:$('#displayName').value.trim()||$('#email').value.trim(),grade:$('#grade').value,target_school_type:$('#target').value};const r=await sb('/auth/v1/signup',{method:'POST',auth:false,body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value,data:meta})});if(!r?.access_token){alert('회원가입 후 이메일 확인이 필요할 수 있습니다.');mode='signin';apply();return}saveSession(r);await ensureProfile(meta)}else{const r=await sb('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});if(!r?.access_token)throw Error('로그인 토큰이 없습니다.');saveSession(r);await ensureProfile()}await loadData();screen='today';render()}catch(err){alert('인증 실패: '+err.message)}};apply()}
function renderToday(){setHead('오늘의 궤도','공부 전 5초, 공부 후 20초.');const t=data.sessions.filter(s=>String(s.started_at||s.created_at||'').slice(0,10)===today());const mins=t.filter(s=>s.mode==='self').reduce((a,s)=>a+Number(s.minutes||0),0);html(`${userStrip()}<section class="panel"><h2>오늘 지나갈 행성</h2><p class="muted">오늘 목표 ${data.goals.length}개</p><button id="addGoal" class="secondary">+ 오늘 목표 추가</button></section><section class="panel light"><div class="muted">오늘 개인공부</div><div style="font-size:30px;font-weight:950">${fmt(mins)}</div></section><button id="goStudy" class="primary big">학습 궤도 진입</button>`);bindLogout();$('#goStudy').onclick=()=>{screen='study';render()};$('#addGoal').onclick=()=>openGoal()}
function openGoal(){const m=$('#modal');m.innerHTML=`<form class="modal-body" id="goalForm"><h3>오늘 목표 추가</h3><div class="field"><label class="label">과목</label><select id="gs"><option>국어</option><option>영어</option><option selected>수학</option><option>과학</option><option>사회</option><option>기타</option></select></div><div class="field"><label class="label">내용</label><input id="gt"></div><div class="field"><label class="label">목표량</label><input id="ga"></div><div class="modal-actions"><button type="button" class="secondary" onclick="this.closest('dialog').close()">취소</button><button class="primary">저장</button></div></form>`;m.showModal();$('#goalForm').onsubmit=async e=>{e.preventDefault();await sb('/rest/v1/daily_goals',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user.id,goal_date:today(),subject:$('#gs').value,title:$('#gt').value,target_amount:$('#ga').value,is_done:false})});await loadData();m.close();renderToday()}}
function renderStudy(){setHead('학습','기록은 짧게, 학습은 깊게.');html(`${userStrip()}<section class="panel"><h2>개인공부</h2><button id="startTimer" class="primary">타이머 시작</button></section><section class="panel light"><h2>학원 숙제</h2><p class="muted">소요시간은 단순 기록 모드로 사용합니다.</p></section>`);bindLogout();$('#startTimer').onclick=()=>{timer={start:Date.now()};alert('타이머가 시작되었습니다.')}}
function cover(b){return b.thumbnail_url?`<div class="cover"><img src="${esc(b.thumbnail_url)}"></div>`:`<div class="cover">${esc(b.subject||'기타')}</div>`}function acc(b){return b.solved_count?(((b.solved_count-b.wrong_count)/b.solved_count)*100).toFixed(1):'0.0'}
function renderBooks(){setHead('문제집 행성','도서 API로 검색하고 DB에 저장합니다.');const books=data.books.filter(b=>b.status!=='archived');html(`${userStrip()}<div class="stack">${books.length?books.map(b=>`<section class="panel book-card">${cover(b)}<div><strong>${esc(b.title)}</strong><div class="muted">${esc(b.publisher||'')} · ${esc(b.subject||'기타')}</div><div class="progress"><span style="width:${b.total_problems?Math.min(100,Math.round((b.solved_count/b.total_problems)*100)):0}%"></span></div><div class="muted">${b.solved_count||0}/${b.total_problems||0}문제 · 정답률 ${acc(b)}%</div></div></section>`).join(''):'<section class="panel light"><h2>등록된 문제집이 없습니다.</h2></section>'}</div><button id="addBook" class="primary" style="margin-top:14px">+ 문제집 검색 추가</button>`);bindLogout();$('#addBook').onclick=openBookSearch}
function openBookSearch(){const m=$('#modal');m.innerHTML=`<div class="modal-body"><h3>문제집 검색</h3><div class="field"><input id="bq" value="최상위 수학 6-2"></div><button id="bs" class="primary">검색</button><div id="br"></div><button class="secondary" style="margin-top:10px" onclick="this.closest('dialog').close()">닫기</button></div>`;m.showModal();$('#bs').onclick=async()=>{const r=await localJson('/api/book-search?q='+encodeURIComponent($('#bq').value));$('#br').innerHTML=(r.items||[]).map((b,i)=>`<div class="search-result light-card" data-i="${i}">${cover({thumbnail_url:b.thumbnail})}<div><strong>${esc(b.title)}</strong><div class="muted">${esc(b.publisher||'')}</div></div></div>`).join('');document.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>registerBook(r.items[Number(el.dataset.i)],m))}}
function registerBook(b,m){m.innerHTML=`<form class="modal-body" id="rb"><h3>문제집 등록</h3><div class="field"><label class="label">과목</label><select id="rbs"><option>국어</option><option>영어</option><option selected>수학</option><option>과학</option><option>사회</option><option>기타</option></select></div><div class="field"><label class="label">전체 문제 수</label><input id="rbt" type="number" value="500"></div><div class="modal-actions"><button type="button" class="secondary" onclick="this.closest('dialog').close()">취소</button><button class="primary">등록</button></div></form>`;$('#rb').onsubmit=async e=>{e.preventDefault();await sb('/rest/v1/books',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user.id,title:b.title,authors:b.authors||[],publisher:b.publisher||'',isbn:b.isbn||'',thumbnail_url:b.thumbnail||'',source_url:b.url||'',subject:$('#rbs').value,total_problems:Number($('#rbt').value||0),solved_count:0,wrong_count:0,total_minutes:0,status:'active'})});await loadData();m.close();renderBooks()}}
function renderReport(){setHead('리포트','누적 학습 통계를 확인합니다.');const mins=data.sessions.reduce((a,s)=>a+Number(s.minutes||0),0),solved=data.sessions.reduce((a,s)=>a+Number(s.solved_count||0),0),wrong=data.sessions.reduce((a,s)=>a+Number(s.wrong_count||0),0);html(`${userStrip()}<section class="panel light"><div class="statgrid"><div class="stat"><b>${fmt(mins)}</b><small>총 학습</small></div><div class="stat"><b>${solved}</b><small>풀이 문제</small></div><div class="stat"><b>${solved?(((solved-wrong)/solved)*100).toFixed(1):'0.0'}%</b><small>정답률</small></div><div class="stat"><b>${data.mistakes.length}</b><small>기억할 문제</small></div></div></section>`);bindLogout()}
function renderArchive(){setHead('기록관','끝낸 문제집의 역사입니다.');const books=data.books.filter(b=>b.status==='archived');html(`${userStrip()}${books.length?books.map(b=>`<section class="panel light"><h3>${esc(b.title)}</h3><p class="muted">${b.total_problems||0}문제 · 정답률 ${acc(b)}%</p></section>`).join(''):'<section class="panel light"><h2>아직 완주한 문제집이 없습니다.</h2></section>'}`);bindLogout()}
</script>
