<style>
:root{--bg:#070b1e;--panel:rgba(255,255,255,.12);--line:rgba(255,255,255,.18);--text:#f8fafc;--muted:#aab4c5;--card:rgba(255,255,255,.94);--ink:#0f172a;--green:#80ed99;--yellow:#ffd166;--cyan:#56ccf2;--violet:#b8a1ff;--radius:26px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{color:var(--text);background:radial-gradient(circle at 18% 0%,rgba(86,204,242,.35),transparent 30%),radial-gradient(circle at 88% 10%,rgba(184,161,255,.32),transparent 34%),linear-gradient(180deg,#070b1e,#111735);overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}.stars{position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#fff 1px,transparent 1px);background-size:72px 72px,119px 119px;background-position:0 0,28px 38px;mask-image:linear-gradient(to bottom,#000,transparent)}#appShell{position:relative;min-height:100vh;max-width:520px;margin:0 auto;padding-bottom:92px}.hero{display:flex;justify-content:space-between;gap:18px;padding:28px 20px 16px}.eyebrow{margin:0 0 8px;color:#c7d2fe;letter-spacing:.16em;font-size:12px;font-weight:950}h1{margin:0;font-size:32px;line-height:1.08;letter-spacing:-.04em}.subtitle{margin:8px 0 0;color:#cbd5e1;font-size:14px}.orbit-logo{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid var(--line);box-shadow:0 14px 44px rgba(86,204,242,.2)}.orbit-logo span{width:24px;height:24px;border-radius:50%;background:#fff;position:relative}.orbit-logo span:after{content:"";position:absolute;inset:-15px -23px;border:3px solid rgba(255,255,255,.75);border-radius:50%;transform:rotate(-18deg)}main{padding:0 16px 24px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;backdrop-filter:blur(18px);box-shadow:0 20px 70px rgba(0,0,0,.16)}.light{background:var(--card);color:var(--ink)}.muted{color:var(--muted)}.light .muted{color:#64748b}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:12px}.primary,.secondary,.danger{border:0;border-radius:18px;padding:15px 16px;font-weight:950;width:100%}.primary{color:#111827;background:linear-gradient(135deg,var(--yellow),var(--green));box-shadow:0 18px 36px rgba(255,209,102,.22)}.secondary{color:#fff;background:rgba(255,255,255,.12);border:1px solid var(--line)}.light .secondary,.modal-body .secondary{color:#111827;background:#fff;border:1px solid #e2e8f0}.danger{background:#fee2e2;color:#991b1b}.big{font-size:18px;padding:19px}.field{margin-bottom:13px}.label{display:block;font-size:13px;font-weight:950;color:#dbeafe;margin-bottom:7px}.modal-body .label{color:#475569}input,select{width:100%;border:0;border-radius:16px;padding:14px;background:#f8fafc;color:#111827;outline:2px solid transparent}input:focus,select:focus{outline-color:#93c5fd}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill{display:inline-flex;border-radius:999px;padding:6px 10px;background:rgba(255,255,255,.14);font-size:12px;font-weight:950}.light .pill{background:#eef2ff;color:#3730a3}.orbit-card,.book-card,.search-result{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}.light-card{background:#f8fafc;color:#111827;border:1px solid #e2e8f0}.planet{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--violet));box-shadow:0 0 28px rgba(86,204,242,.34)}.check{width:26px;height:26px;border:1px solid rgba(255,255,255,.42);border-radius:50%;display:grid;place-items:center}.done .check{background:var(--green);color:#052e16;border:0}.cover{width:58px;height:82px;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,#1d4ed8,#7c3aed);color:#fff;display:grid;place-items:end start;padding:8px;font-size:11px;font-weight:900}.cover img{width:100%;height:100%;object-fit:cover}.progress{height:10px;border-radius:999px;overflow:hidden;background:#e2e8f0;margin:10px 0 8px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#56ccf2,#80ed99,#ffd166)}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:20px;background:#f8fafc;border:1px solid #e2e8f0}.stat b{display:block;font-size:24px}.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:78px;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(7,11,30,.84);border-top:1px solid var(--line);backdrop-filter:blur(18px);z-index:10}.tabbar button{border:0;background:transparent;color:#94a3b8;display:grid;place-items:center;gap:2px;padding:7px 2px}.tabbar b{font-size:21px}.tabbar span{font-size:11px;font-weight:950}.tabbar .active{color:#fff}dialog{border:0;border-radius:28px;padding:0;width:min(480px,calc(100% - 28px));max-height:88vh;overflow:auto;background:#fff;color:#111827;box-shadow:0 24px 100px rgba(0,0,0,.45)}dialog::backdrop{background:rgba(2,6,23,.68)}.modal-body{padding:20px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}@media(min-width:900px){body{padding:24px}#appShell{width:min(1180px,calc(100vw - 48px));max-width:none;min-height:calc(100vh - 48px);display:grid;grid-template-columns:112px minmax(0,1fr);grid-template-rows:132px minmax(0,1fr);padding:0;border:1px solid var(--line);border-radius:34px;overflow:hidden;background:rgba(7,11,30,.28)}.hero{grid-column:1/-1;grid-row:1;padding:30px 36px;border-bottom:1px solid var(--line)}h1{font-size:44px}main{grid-column:2;grid-row:2;width:100%;max-width:820px;margin:0 auto;padding:24px 36px 44px}.tabbar{position:relative;left:auto;bottom:auto;transform:none;grid-column:1;grid-row:2;width:112px;height:100%;display:flex;flex-direction:column;gap:8px;padding:20px 10px;border-top:0;border-right:1px solid var(--line)}.tabbar button{width:90px;height:64px;min-height:64px;margin:0 auto;border-radius:18px}.tabbar .active{background:rgba(255,255,255,.14)}}@media(max-width:420px){.grid2,.modal-actions{grid-template-columns:1fr}.hero{padding:22px 16px 12px}h1{font-size:28px}main{padding:0 14px 24px}}
</style>

<body>
<div class="stars"></div><div id="appShell"><header class="hero"><div><p class="eyebrow">STUDY ORBIT</p><h1 id="screenTitle">ORBIT 시작</h1><p id="screenSub" class="subtitle">배포 안정화 버전</p></div><div class="orbit-logo"><span></span></div></header><main id="screen"></main><nav class="tabbar"><button data-screen="today" class="active"><b>✦</b><span>오늘</span></button><button data-screen="study"><b>◷</b><span>학습</span></button><button data-screen="books"><b>▣</b><span>문제집</span></button><button data-screen="report"><b>▥</b><span>리포트</span></button><button data-screen="archive"><b>◎</b><span>기록관</span></button></nav></div><dialog id="modal"></dialog>
<script>
const $=s=>document.querySelector(s);const KEY='study-orbit-session-v067';let cfg=null,session=readSession(),profile=null,screen='today',timer=null,data={goals:[],books:[],sessions:[],mistakes:[]};const today=()=>new Date().toISOString().slice(0,10);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const fmt=m=>`${Math.floor(Number(m||0)/60)}시간 ${Number(m||0)%60}분`;window.addEventListener('error',e=>fatal(e.message));window.addEventListener('unhandledrejection',e=>fatal(e.reason?.message||e.reason||'알 수 없는 오류'));main();
async function main(){bindTabs();tabs(false);setHead('ORBIT 로딩','환경설정을 확인합니다.');html(`<section class="panel light"><h2>잠시만요</h2><p class="muted">앱을 준비하고 있습니다.</p></section>`);try{cfg=await localJson('/api/config');if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)return setup('Supabase 환경변수가 비어 있습니다.');if(!session?.access_token)return auth('signup');if(!await loadUser()){clearSession();return auth('signin')}await ensureProfile();await loadData();render()}catch(e){setup(e.message)}}
function setHead(t,s){$('#screenTitle').textContent=t;$('#screenSub').textContent=s||'기록은 짧게, 학습은 깊게.'}function html(v){$('#screen').innerHTML=v}function tabs(v){$('.tabbar').style.display=v?'grid':'none'}function setup(m){tabs(false);setHead('설정 필요','Supabase와 Vercel 환경변수를 확인하세요.');html(`<section class="panel light"><h2>설정 오류</h2><p class="muted">${esc(m)}</p></section>`)}function fatal(m){tabs(false);setHead('앱 오류','원인을 화면에 표시합니다.');html(`<section class="panel light"><h2>앱 초기화 실패</h2><p class="muted">${esc(m)}</p><button class="primary" onclick="location.reload()">다시 시도</button></section>`)}
function readSession(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}function saveSession(s){session=s;localStorage.setItem(KEY,JSON.stringify(s))}function clearSession(){session=null;localStorage.removeItem(KEY)}
async function localJson(url){const r=await fetch(url);const t=await r.text();if(!r.ok)throw Error(t||`HTTP ${r.status}`);return t?JSON.parse(t):null}function hdr(auth=true){const h={apikey:cfg.supabaseAnonKey,'Content-Type':'application/json'};if(auth&&session?.access_token)h.Authorization=`Bearer ${session.access_token}`;return h}async function sb(path,opt={}){const r=await fetch(cfg.supabaseUrl+path,{method:opt.method||'GET',headers:{...hdr(opt.auth!==false),...(opt.headers||{})},body:opt.body});const t=await r.text();if(!r.ok){try{const j=JSON.parse(t);throw Error(j.message||j.error_description||j.error||t)}catch(e){if(e.message)throw e;throw Error(t||`HTTP ${r.status}`)}}return t?JSON.parse(t):null}
async function loadUser(){try{const u=await sb('/auth/v1/user');if(!u?.id)return false;session.user=u;localStorage.setItem(KEY,JSON.stringify(session));return true}catch{return false}}async function ensureProfile(meta={}){if(!session?.user?.id&&!(await loadUser()))throw Error('로그인 사용자 정보를 확인할 수 없습니다.');const uid=encodeURIComponent(session.user.id);const rows=await sb(`/rest/v1/profiles?select=*&id=eq.${uid}`);if(rows?.length){profile=rows[0];return}const body={id:session.user.id,display_name:meta.display_name||session.user.user_metadata?.display_name||session.user.email||'ORBIT 사용자',grade:meta.grade||session.user.user_metadata?.grade||'미지정',target_school_type:meta.target_school_type||session.user.user_metadata?.target_school_type||'나의 학습 기록'};const ins=await sb('/rest/v1/profiles',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});profile=ins?.[0]||body}
async function signUp(email,pw,meta){const r=await sb('/auth/v1/signup',{method:'POST',auth:false,body:JSON.stringify({email,password:pw,data:meta})});if(r?.access_token){saveSession(r);await ensureProfile(meta);await loadData();screen='today';render();return}alert('회원가입은 되었지만 이메일 확인이 필요할 수 있습니다. 로그인 화면에서 다시 시도하세요.');auth('signin')}async function signIn(email,pw){const r=await sb('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:JSON.stringify({email,password:pw})});if(!r?.access_token)throw Error('로그인 토큰을 받지 못했습니다.');saveSession(r);await ensureProfile();await loadData();screen='today';render()}
async function loadData(){const [p,b,g,s,m]=await Promise.all([sb(`/rest/v1/profiles?select=*&id=eq.${encodeURIComponent(session.user.id)}`),sb('/rest/v1/books?select=*&order=created_at.desc'),sb(`/rest/v1/daily_goals?select=*&goal_date=eq.${today()}&order=created_at.asc`),sb('/rest/v1/study_sessions?select=*&order=created_at.desc&limit=80'),sb('/rest/v1/memorable_mistakes?select=*&order=created_at.desc&limit=80')]);profile=p?.[0]||profile;data={books:b||[],goals:g||[],sessions:s||[],mistakes:m||[]}}
function auth(mode='signup'){tabs(false);setHead('ORBIT 로그인','웹 DB에 나의 학습 기록을 저장합니다.');html(`<section class="panel"><h2>학습 궤도 입장</h2><p class="muted">Supabase 계정으로 로그인하거나 새 사용자를 등록합니다.</p><form id="authForm"><div class="field"><label class="label">이메일</label><input id="email" type="email" required></div><div class="field"><label class="label">비밀번호</label><input id="pw" type="password" minlength="6" required></div><div class="signup"><div class="field"><label class="label">이름 또는 별명</label><input id="name" placeholder="예: uniquelife"></div><div class="grid2"><div class="field"><label class="label">학년</label><select id="grade"><option>초6</option><option>중1</option><option>중2</option><option>중3</option><option>고1</option><option>기타</option></select></div><div class="field"><label class="label">목표</label><select id="target"><option>한국과학영재학교 준비</option><option>과학고 준비</option><option>특목고 준비</option><option>수학·과학 심화</option></select></div></div></div><button class="primary big" id="submit">회원가입</button></form><button class="secondary" id="toggle" style="margin-top:10px">이미 계정이 있어요</button></section>`);const apply=()=>{document.querySelectorAll('.signup').forEach(e=>e.style.display=mode==='signup'?'block':'none');$('#submit').textContent=mode==='signup'?'회원가입':'로그인';$('#toggle').textContent=mode==='signup'?'이미 계정이 있어요':'새 계정 만들기'};$('#toggle').onclick=()=>{mode=mode==='signup'?'signin':'signup';apply()};$('#authForm').onsubmit=async e=>{e.preventDefault();try{mode==='signup'?await signUp($('#email').value.trim(),$('#pw').value,{display_name:$('#name').value.trim()||$('#email').value.trim(),grade:$('#grade').value,target_school_type:$('#target').value}):await signIn($('#email').value.trim(),$('#pw').value)}catch(err){alert('인증 실패: '+err.message)}};apply()}
function render(){tabs(true);document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));if(screen==='today')todayView();if(screen==='study')studyView();if(screen==='books')booksView();if(screen==='report')reportView();if(screen==='archive')archiveView()}function bindTabs(){document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=async()=>{screen=b.dataset.screen;try{if(session?.access_token)await loadData();render()}catch(e){fatal(e.message)}})}function user(){return `<section class="panel"><div class="row"><div><b>${esc(profile?.display_name||session.user.email)}</b><div class="muted" style="font-size:12px">${esc(profile?.grade||'')} · ${esc(profile?.target_school_type||'')}</div></div><button class="secondary" id="logout" style="width:auto;padding:10px 12px">로그아웃</button></div></section>`}function bindLogout(){const b=$('#logout');if(b)b.onclick=()=>{clearSession();auth('signin')}}function activeBooks(){return data.books.filter(b=>b.status!=='archived')}function prog(b){return b.total_problems?Math.min(100,Math.round((b.solved_count||0)/(b.total_problems||1)*100)):0}function acc(b){return b.solved_count?(((b.solved_count-b.wrong_count)/b.solved_count)*100).toFixed(1):'0.0'}function cover(b){const u=b.thumbnail_url||b.thumbnail||'';return u?`<div class="cover"><img src="${esc(u)}"></div>`:`<div class="cover">${esc(b.subject||'기타')}<br>${esc(b.title||'')}</div>`}
function todayView(){setHead('오늘의 궤도','공부 전 5초, 공부 후 20초.');const ts=data.sessions.filter(s=>String(s.started_at||s.created_at||'').slice(0,10)===today());const min=ts.filter(s=>s.mode==='self').reduce((a,s)=>a+Number(s.minutes||0),0);html(`${user()}<section class="panel"><div class="row"><div><div class="muted">${new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'}).format(new Date())}</div><h2>오늘 지나갈 행성</h2></div><span class="pill">${data.goals.filter(g=>g.is_done).length}/${data.goals.length}</span></div><div class="stack">${data.goals.length?data.goals.map(g=>`<div class="orbit-card ${g.is_done?'done':''}" data-goal="${g.id}"><div class="planet"></div><div><b>${esc(g.subject)} · ${esc(g.title)}</b><div class="muted">${esc(g.target_amount||'')}</div></div><div class="check">${g.is_done?'✓':''}</div></div>`).join(''):'<p class="muted">오늘 목표가 없습니다. 바로 공부를 시작해도 됩니다.</p>'}</div><button class="secondary" id="goal" style="margin-top:14px">+ 오늘 목표 추가</button></section><section class="panel light"><div class="row"><div><div class="muted">오늘 개인공부</div><div style="font-size:30px;font-weight:950">${fmt(min)}</div></div><span class="pill">${ts.length}회 기록</span></div></section><button class="primary big" id="start">학습 궤도 진입</button>`);bindLogout();$('#goal').onclick=goalModal;$('#start').onclick=startModal;document.querySelectorAll('[data-goal]').forEach(el=>el.onclick=async()=>{const g=data.goals.find(x=>x.id===el.dataset.goal);await sb(`/rest/v1/daily_goals?id=eq.${g.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({is_done:!g.is_done})});await loadData();todayView()})}
function goalModal(){const m=$('#modal');m.innerHTML=`<form class="modal-body" id="f"><h3>오늘 목표 추가</h3><div class="field"><label class="label">과목</label><select id="sub"><option>국어</option><option>영어</option><option selected>수학</option><option>과학</option><option>사회</option><option>기타</option></select></div><div class="field"><label class="label">내용</label><input id="title"></div><div class="field"><label class="label">목표량</label><input id="amt" placeholder="예: 30문제"></div><div class="modal-actions"><button type="button" class="secondary" onclick="modal.close()">취소</button><button class="primary">저장</button></div></form>`;m.showModal();$('#f').onsubmit=async e=>{e.preventDefault();if(!$('#title').value.trim())return;await sb('/rest/v1/daily_goals',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user.id,goal_date:today(),subject:$('#sub').value,title:$('#title').value.trim(),target_amount:$('#amt').value.trim(),is_done:false})});await loadData();m.close();todayView()}}
function studyView(){setHead('학습','타이머를 켜고 화면은 닫아도 됩니다.');if(timer)return timerView();html(`${user()}<section class="panel"><h2>개인공부</h2><button class="primary" id="self">타이머 시작</button></section><section class="panel light"><h2>학원 숙제</h2><button class="secondary" id="acad">숙제 기록</button></section>`);bindLogout();$('#self').onclick=startModal;$('#acad').onclick=academyModal}function startModal(){const m=$('#modal');m.innerHTML=`<form class="modal-body" id="sf"><h3>무엇을 공부할까요?</h3><div class="field"><label class="label">과목</label><select id="s"><option>국어</option><option>영어</option><option selected>수학</option><option>과학</option><option>사회</option><option>기타</option></select></div><div class="field"><label class="label">문제집</label><select id="book"><option value="">문제집 없이 공부</option>${activeBooks().map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join('')}</select></div><div class="modal-actions"><button type="button" class="secondary" onclick="modal.close()">취소</button><button class="primary">시작</button></div></form>`;m.showModal();$('#sf').onsubmit=e=>{e.preventDefault();timer={start:Date.now(),subject:$('#s').value,book_id:$('#book').value||null};m.close();screen='study';render()}}function timerView(){const b=timer.book_id?data.books.find(x=>x.id===timer.book_id):null;html(`${user()}<section class="panel" style="text-align:center"><div class="muted">${esc(timer.subject)}</div><h2>${b?esc(b.title):'문제집 없이 공부'}</h2><div id="clock" style="font-size:42px;font-weight:950;margin:36px">00:00:00</div><button class="danger" id="finish">학습 종료</button></section>`);bindLogout();clearInterval(window._tick);window._tick=setInterval(()=>{const sec=Math.floor((Date.now()-timer.start)/1000);const h=String(Math.floor(sec/3600)).padStart(2,'0'),mi=String(Math.floor(sec%3600/60)).padStart(2,'0'),s=String(sec%60).padStart(2,'0');const el=$('#clock');if(el)el.textContent=`${h}:${mi}:${s}`},500);$('#finish').onclick=finishModal}function finishModal(){const m=$('#modal'),minutes=Math.max(1,Math.round((Date.now()-timer.start)/60000));m.innerHTML=`<form class="modal-body" id="ff"><h3>학습 종료</h3><p class="muted">${minutes}분</p><div class="grid2"><div class="field"><label class="label">푼 문제</label><input id="sol" type="number" value="0"></div><div class="field"><label class="label">틀린 문제</label><input id="wr" type="number" value="0"></div></div><div class="field"><label class="label">기억할 문제</label><input id="memo"></div><div class="modal-actions"><button type="button" class="secondary" onclick="modal.close()">취소</button><button class="primary">저장</button></div></form>`;m.showModal();$('#ff').onsubmit=async e=>{e.preventDefault();const sol=Number($('#sol').value||0),wr=Math.min(sol,Number($('#wr').value||0)),started=new Date(timer.start).toISOString(),ended=new Date().toISOString();const ins=await sb('/rest/v1/study_sessions',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:session.user.id,book_id:timer.book_id,subject:timer.subject,mode:'self',started_at:started,ended_at:ended,minutes,solved_count:sol,wrong_count:wr})});if(timer.book_id){const b=data.books.find(x=>x.id===timer.book_id);await sb(`/rest/v1/books?id=eq.${b.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({solved_count:Math.min(b.total_problems,(b.solved_count||0)+sol),wrong_count:(b.wrong_count||0)+wr,total_minutes:(b.total_minutes||0)+minutes})});if($('#memo').value.trim())await sb('/rest/v1/memorable_mistakes',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user.id,book_id:timer.book_id,study_session_id:ins?.[0]?.id,problem_label:$('#memo').value.trim(),memo:$('#memo').value.trim(),review_status:'needs_review'})})}timer=null;clearInterval(window._tick);await loadData();m.close();render()}}
function academyModal(){const m=$('#modal');m.innerHTML=`<form class="modal-body" id="af"><h3>학원 숙제 기록</h3><div class="field"><label class="label">과목</label><select id="as"><option>국어</option><option>영어</option><option selected>수학</option><option>과학</option><option>사회</option><option>기타</option></select></div><div class="field"><label class="label">문제집</label><select id="ab"><option value="">문제집 없음</option>${activeBooks().map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join('')}</select></div><div class="grid2"><input id="am" type="number" value="50"><input id="asol" type="number" value="0"></div><div class="field"><label class="label">틀린 문제</label><input id="awr" type="number" value="0"></div><div class="modal-actions"><button type="button" class="secondary" onclick="modal.close()">취소</button><button class="primary">저장</button></div></form>`;m.showModal();$('#af').onsubmit=async e=>{e.preventDefault();const book=$('#ab').value||null,min=Number($('#am').value||0),sol=Number($('#asol').value||0),wr=Math.min(sol,Number($('#awr').value||0));await sb('/rest/v1/study_sessions',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user.id,book_id:book,subject:$('#as').value,mode:'academy',started_at:new Date().toISOString(),ended_at:new Date().toISOString(),minutes:min,solved_count:sol,wrong_count:wr})});await loadData();m.close();render()}}
function booksView(){setHead('문제집 행성','도서 API로 검색하고 DB에 저장합니다.');const bs=activeBooks();html(`${user()}<div class="stack">${bs.length?bs.map(b=>`<section class="panel light book-card" data-book="${b.id}">${cover(b)}<div><div class="row"><b>${esc(b.title)}</b><span class="pill">${prog(b)}%</span></div><div class="muted">${esc(b.publisher||'')} · ${esc(b.subject||'기타')}</div><div class="progress"><span style="width:${prog(b)}%"></span></div><div class="muted">${b.solved_count||0}/${b.total_problems||0}문제 · 정답률 ${acc(b)}%</div></div></section>`).join(''):'<section class="panel light"><h2>등록된 문제집이 없습니다.</h2></section>'}</div><button class="primary" id="addBook" style="margin-top:14px">+ 문제집 검색 추가</button>`);bindLogout();$('#addBook').onclick=bookSearch;document.querySelectorAll('[data-book]').forEach(el=>el.onclick=()=>bookDetail(el.dataset.book))}function bookSearch(){const m=$('#modal');m.innerHTML=`<div class="modal-body"><h3>문제집 검색</h3><div class="field"><input id="q" value="최상위 수학 6-2"></div><button class="primary" id="search">도서 검색</button><div id="results"></div><button class="secondary" style="margin-top:10px" onclick="modal.close()">닫기</button></div>`;m.showModal();const go=async()=>{const q=$('#q').value.trim();$('#results').innerHTML='<p class="muted">검색 중...</p>';try{const r=await localJson('/api/book-search?q='+encodeURIComponent(q));$('#results').innerHTML=r.items.map((b,i)=>`<div class="search-result light-card" data-i="${i}">${cover(b)}<div><b>${esc(b.title)}</b><br><span class="muted">${esc(b.publisher||'')}</span></div></div>`).join('')||'<p class="muted">결과 없음</p>';document.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>registerBook(r.items[Number(el.dataset.i)]))}catch(e){$('#results').innerHTML='<p class="muted">검색 실패: '+esc(e.message)+'</p>'}};$('#search').onclick=go;go()}function registerBook(b){const m=$('#modal');m.innerHTML=`<form class="modal-body" id="rb"><h3>문제집 등록</h3><div class="book-card light-card">${cover(b)}<div><b>${esc(b.title)}</b><p class="muted">${esc(b.publisher||'')}</p></div></div><div class="field"><label class="label">과목</label><select id="rsub"><option>국어</option><option>영어</option><option selected>수학</option><option>과학</option><option>사회</option><option>기타</option></select></div><div class="field"><label class="label">전체 문제 수</label><input id="total" type="number" value="500"></div><div class="modal-actions"><button type="button" class="secondary" onclick="modal.close()">취소</button><button class="primary">추가</button></div></form>`;m.showModal();$('#rb').onsubmit=async e=>{e.preventDefault();await sb('/rest/v1/books',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:session.user.id,title:b.title,authors:b.authors||[],publisher:b.publisher||'',isbn:b.isbn||'',thumbnail_url:b.thumbnail||'',source_url:b.url||'',subject:$('#rsub').value,total_problems:Number($('#total').value||1),solved_count:0,wrong_count:0,total_minutes:0,status:'active'})});await loadData();m.close();booksView()}}function bookDetail(id){const b=data.books.find(x=>x.id===id);if(!b)return;const m=$('#modal');m.innerHTML=`<div class="modal-body"><div class="book-card light-card">${cover(b)}<div><h3>${esc(b.title)}</h3><p class="muted">${esc(b.publisher||'')} · ${esc(b.subject||'')}</p></div></div><div class="statgrid"><div class="stat"><b>${b.solved_count||0}</b><small>풀이</small></div><div class="stat"><b>${acc(b)}%</b><small>정답률</small></div><div class="stat"><b>${b.wrong_count||0}</b><small>오답</small></div><div class="stat"><b>${data.mistakes.filter(x=>x.book_id===id).length}</b><small>기억</small></div></div><div class="modal-actions"><button class="secondary" onclick="modal.close()">닫기</button><button class="danger" id="del">삭제</button></div></div>`;m.showModal();$('#del').onclick=async()=>{if(confirm('삭제할까요?')){await sb(`/rest/v1/books?id=eq.${id}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});await loadData();m.close();booksView()}}}
function reportView(){setHead('리포트','웹 DB 기준으로 계산합니다.');const total=data.sessions.reduce((a,s)=>a+Number(s.minutes||0),0),self=data.sessions.filter(s=>s.mode==='self').reduce((a,s)=>a+Number(s.minutes||0),0),sol=data.sessions.reduce((a,s)=>a+Number(s.solved_count||0),0),wr=data.sessions.reduce((a,s)=>a+Number(s.wrong_count||0),0);html(`${user()}<section class="panel light"><div class="statgrid"><div class="stat"><b>${fmt(total)}</b><small>총 학습</small></div><div class="stat"><b>${total?Math.round(self/total*100):0}%</b><small>자기주도</small></div><div class="stat"><b>${sol}</b><small>풀이 문제</small></div><div class="stat"><b>${sol?(((sol-wr)/sol)*100).toFixed(1):'0.0'}%</b><small>정답률</small></div></div></section>`);bindLogout()}function archiveView(){setHead('기록관','끝낸 문제집을 보관합니다.');html(`${user()}<section class="panel light"><h2>아직 완주한 행성이 없습니다.</h2><p class="muted">한 권을 끝내면 이곳에 보관됩니다.</p></section>`);bindLogout()}
</script>
</body>
</html>
