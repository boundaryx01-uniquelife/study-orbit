<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1026" />
  <meta name="description" content="STUDY ORBIT 학습 기록 PWA" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>STUDY ORBIT</title>
  <link rel="stylesheet" href="/orbit.css?v=0.7.2" />
  <link rel="stylesheet" href="/orbit-buttons.css?v=0.7.5" />
  <link rel="stylesheet" href="/orbit-archive.css?v=0.7.2" />
</head>
<body>
  <div class="stars"></div>
  <div id="appShell">
    <header class="hero">
      <div>
        <p class="eyebrow">STUDY ORBIT</p>
        <h1 id="screenTitle">ORBIT 시작</h1>
        <p id="screenSub" class="subtitle">Record less. Learn more.</p>
      </div>
      <div class="orbit-logo"><span></span></div>
    </header>
    <main id="screen"></main>
    <nav class="tabbar" aria-label="주 메뉴">
      <button data-screen="today" class="active"><b>✦</b><span>오늘</span></button>
      <button data-screen="study"><b>◷</b><span>학습</span></button>
      <button data-screen="books"><b>▣</b><span>문제집</span></button>
      <button data-screen="report"><b>▥</b><span>리포트</span></button>
      <button data-screen="archive"><b>◎</b><span>기록관</span></button>
    </nav>
  </div>
  <dialog id="modal"></dialog>
  <script src="/orbit.js?v=0.7.4"></script>
  <script src="/orbit-progress.js?v=0.7.3"></script>
  <script src="/orbit-archive.js?v=0.7.2"></script>
  <script src="/pwa.js?v=0.7.2"></script>
</body>
</html>
